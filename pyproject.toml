[project]
name = "universal-data-normalizer"
version = "0.1.0"
description = "Normalizes CSV, JSON, JSON Lines, XML, Excel, text and Parquet data sources into a unified, open format."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Lucas Berlage", email = "berlage.lucas@gmail.com" }]
keywords = ["etl", "data-engineering", "data-lakehouse", "csv", "parquet", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "rich>=13.9.4",
    "typer>=0.26.8",
]

[project.urls]
Repository = "https://github.com/berlagelucas-hub/universal-data-normalizer"

[project.scripts]
udn = "universal_data_normalizer.cli:app"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pre-commit>=4.6.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/universal_data_normalizer"]
